<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anfragen - Admin</title>
    <link rel="stylesheet" href="../css/fonts.css">
    <style>
        :root {
            --color-primary: #E2001A;
            --color-primary-hover: #ff1a35;
            --color-bg-dark: #F5F5F5;
            --color-bg-card: #FFFFFF;
            --color-bg-elevated: #FAFAFA;
            --color-border: rgba(0, 0, 0, 0.10);
            --color-text-primary: #111111;
            --color-text-secondary: #555555;
            --color-text-muted: #767676;
            --color-danger: #dc3545;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--color-bg-dark);
            color: var(--color-text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        a { color: var(--color-primary); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .admin-container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .header h1 { margin: 0; font-family: 'Urbanist', sans-serif; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        .card { background: var(--color-bg-card); padding: 20px 24px; border-radius: var(--radius-lg); border: 1px solid var(--color-border); margin-bottom: 16px; }

        .btn {
            padding: 9px 16px; background: var(--color-primary); color: #fff; border: none;
            border-radius: var(--radius-md); cursor: pointer; font-weight: 600; font-size: 0.88rem;
            display: inline-flex; align-items: center; gap: 6px; font-family: inherit; text-decoration: none;
        }
        .btn:hover { background: var(--color-primary-hover); text-decoration: none; }
        .btn-secondary { background: var(--color-bg-elevated); border: 1px solid var(--color-border); color: var(--color-text-primary); }
        .btn-secondary:hover { background: #eee; }
        .btn-danger { background: var(--color-danger); }
        .btn-sm { padding: 6px 12px; font-size: 0.82rem; }

        .hidden { display: none !important; }

        .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        select, textarea { padding: 8px 10px; border: 1px solid var(--color-border); border-radius: 8px; font: inherit; background: #fff; }
        textarea { width: 100%; min-height: 60px; resize: vertical; }

        .req-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
        .req-head h3 { margin: 0; font-size: 1.05rem; }
        .req-meta { font-size: .85rem; color: var(--color-text-secondary); margin-top: 4px; line-height: 1.6; }
        .req-msg { white-space: pre-wrap; background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: 8px; padding: 12px 14px; margin: 12px 0; font-size: .93rem; line-height: 1.55; overflow-wrap: anywhere; }
        .req-foot { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
        .req-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .req.done { opacity: .7; }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .75rem; font-weight: 700; margin-left: 6px; vertical-align: middle; }
        .t-sponsoring { background: #fee2e2; color: #991b1b; }
        .t-allgemein { background: #e0f2fe; color: #075985; }
        .t-fehler { background: #fef3c7; color: #92400e; }
        .s-neu { background: #dcfce7; color: #166534; }
        .s-in_bearbeitung { background: #e0e7ff; color: #3730a3; }
        .s-erledigt { background: #f3f4f6; color: #4b5563; }

        .empty { color: var(--color-text-muted); padding: 24px 0; text-align: center; }
        .hint { font-size: .8rem; color: var(--color-text-muted); }

        #toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #111; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: .9rem;
            opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 1000;
        }
        #toast.show { opacity: 1; }
        #toast.error { background: var(--color-danger); }

        @media (max-width: 640px) { .req-foot { grid-template-columns: 1fr; } }
    </style>
</head>

<body>
    <div class="admin-container">
        <div class="header">
            <h1>Kontaktanfragen</h1>
            <div class="header-actions">
                <a href="../kontakt.html" target="_blank" class="btn btn-secondary">Formular ansehen</a>
                <a href="einstellungen.html" class="btn btn-secondary">Benachrichtigung</a>
                <a href="sponsoren.html" class="btn btn-secondary">Sponsoren</a>
                <a href="index.html" class="btn btn-secondary">Zurück</a>
            </div>
        </div>

        <div id="denied" class="card hidden">
            <p>Die Anfragen sind nur für Administratoren sichtbar.</p>
        </div>

        <div class="card" id="filterCard">
            <div class="filters">
                <select id="f_status" onchange="render()">
                    <option value="offen">Offen (neu + in Bearbeitung)</option>
                    <option value="neu">Nur neu</option>
                    <option value="erledigt">Erledigt</option>
                    <option value="">Alle</option>
                </select>
                <select id="f_topic" onchange="render()">
                    <option value="">Alle Themen</option>
                </select>
                <span class="hint" id="summary"></span>
            </div>
            <p class="hint" style="margin:10px 0 0;">Erledigte Anfragen werden nach 12 Monaten automatisch gelöscht, alle übrigen nach 24 Monaten.</p>
        </div>

        <div id="list"></div>
    </div>

    <div id="toast"></div>

    <script>
        const API = '../api/kontakt.php';
        const STATUS = { neu: 'neu', in_bearbeitung: 'in Bearbeitung', erledigt: 'erledigt' };
        let csrfToken = '';
        let requests = [];
        let topics = {};
        let interests = {};

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function toast(msg, isError) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'show' + (isError ? ' error' : '');
            clearTimeout(t._h);
            t._h = setTimeout(() => t.className = '', 3500);
        }

        function fmt(ts) {
            const d = new Date(String(ts).replace(' ', 'T') + 'Z');
            return isNaN(d) ? ts : d.toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const auth = await (await fetch('../api/check-auth.php', { credentials: 'include' })).json();
                csrfToken = auth.csrf_token || '';
                if (!auth.authenticated) { location.href = 'index.html'; return; }
                if ((auth.user && auth.user.role) !== 'admin') {
                    document.getElementById('denied').classList.remove('hidden');
                    document.getElementById('filterCard').classList.add('hidden');
                    return;
                }
            } catch (e) {
                toast('Anmeldestatus konnte nicht geprüft werden', true);
                return;
            }
            load();
        });

        async function load() {
            try {
                const res = await (await fetch(`${API}?action=list`, { credentials: 'include' })).json();
                if (!res.success) throw new Error(res.error || 'Fehler');
                if (res.csrf_token) csrfToken = res.csrf_token;
                requests = res.data.requests;
                topics = res.data.topics;
                interests = res.data.interests;
                const sel = document.getElementById('f_topic');
                if (sel.options.length === 1) {
                    for (const [k, v] of Object.entries(topics)) sel.appendChild(new Option(v, k));
                }
                render();
            } catch (e) {
                toast('Laden fehlgeschlagen: ' + e.message, true);
            }
        }

        function render() {
            const fs = document.getElementById('f_status').value;
            const ft = document.getElementById('f_topic').value;
            const items = requests.filter(r =>
                (fs === '' || (fs === 'offen' ? r.status !== 'erledigt' : r.status === fs)) &&
                (ft === '' || r.topic === ft));
            const nNew = requests.filter(r => r.status === 'neu').length;
            document.getElementById('summary').textContent = `${requests.length} gesamt · ${nNew} neu · ${items.length} angezeigt`;

            if (!items.length) {
                document.getElementById('list').innerHTML = '<div class="card empty">Keine Anfragen in dieser Ansicht.</div>';
                return;
            }
            document.getElementById('list').innerHTML = items.map(r => {
                const ints = (r.interests || '').split(',').filter(Boolean).map(k => interests[k] || k);
                const subject = encodeURIComponent('Ihre Anfrage');
                const replyBody = encodeURIComponent(`Hallo ${r.name},\n\nvielen Dank für Ihre Nachricht.\n\n\n\n> ${String(r.message).split('\n').join('\n> ')}`);
                return `<div class="card req ${r.status === 'erledigt' ? 'done' : ''}">
                    <div class="req-head">
                        <h3>${esc(r.name)}${r.company ? ' · ' + esc(r.company) : ''}
                            <span class="badge t-${esc(r.topic)}">${esc(topics[r.topic] || r.topic)}</span>
                            <span class="badge s-${esc(r.status)}">${esc(STATUS[r.status] || r.status)}</span>
                        </h3>
                        <span class="hint">#${Number(r.id)} · ${esc(fmt(r.created_at))}</span>
                    </div>
                    <div class="req-meta">
                        <a href="mailto:${esc(r.email)}?subject=${subject}&body=${replyBody}">${esc(r.email)}</a>
                        ${r.phone ? ` · <a href="tel:${esc(r.phone.replace(/[^0-9+]/g, ''))}">${esc(r.phone)}</a>` : ''}
                        ${ints.length ? `<br>Interesse: ${ints.map(esc).join(', ')}` : ''}
                    </div>
                    <div class="req-msg">${esc(r.message)}</div>
                    <div class="req-foot">
                        <div>
                            <label class="hint" for="note_${r.id}">Interne Notiz</label>
                            <textarea id="note_${r.id}" placeholder="z. B. Angebot geschickt am …">${esc(r.note || '')}</textarea>
                        </div>
                        <div class="req-actions">
                            <select id="status_${r.id}">
                                ${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === r.status ? 'selected' : ''}>${v}</option>`).join('')}
                            </select>
                            <button class="btn btn-sm" onclick="save(${Number(r.id)})">Speichern</button>
                            <button class="btn btn-danger btn-sm" onclick="del(${Number(r.id)})">Löschen</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function post(data) {
            const res = await (await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ ...data, csrf_token: csrfToken })
            })).json();
            if (!res.success) throw new Error(res.error || 'Fehler');
            return res;
        }

        async function save(id) {
            try {
                await post({
                    action: 'update', id,
                    status: document.getElementById('status_' + id).value,
                    note: document.getElementById('note_' + id).value
                });
                toast('Gespeichert');
                load();
            } catch (e) { toast(e.message, true); }
        }

        async function del(id) {
            const r = requests.find(x => Number(x.id) === id);
            if (!confirm(`Anfrage von „${r ? r.name : id}“ endgültig löschen?`)) return;
            try {
                await post({ action: 'delete', id });
                toast('Gelöscht');
                load();
            } catch (e) { toast(e.message, true); }
        }
    </script>
</body>

</html>
